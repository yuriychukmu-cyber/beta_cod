[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datssol"
version = "0.1.0"
description = "DatsSol local simulator and ML/RL agent scaffold"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Codex Agent"}]
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "pyyaml>=6.0",
  "networkx>=3.2",
  "httpx>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
include = ["datssol*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
